services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: spa_replica
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa_replica"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  spa_db:
